<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .stack { flex: 1; display: flex; flex-direction: column; gap: 22px; min-height: 0; }
  .cards-frame { border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px -20px rgba(0,0,0,0.55), 0 0 0 1px rgba(217,226,242,0.10); }
  .cards-frame img { display: block; width: 100%; }
  .two-up { display: flex; gap: 28px; align-items: flex-start; }
  .two-up .shot-frame img { width: 100%; display: block; }
  .two-up .lbl {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--blue-100);
    margin-bottom: 10px;
    display: block;
  }
  .two-up .col { display: flex; flex-direction: column; flex: 1; }
</style>
</head>
<body>
<div class="slide">
  <div class="brand-row"><img src="icon.svg"><span>MCPWP</span></div>
  <h1 class="headline">Full audit log.<br>One-click rollback.</h1>
  <div class="stack">
    <div class="cards-frame"><img src="cr-cards.png"></div>
    <div class="two-up">
      <div class="col">
        <span class="lbl">Pending &middot; needs a decision</span>
        <div class="shot-frame"><img src="cr-pending.png"></div>
      </div>
      <div class="col">
        <span class="lbl">Applied &middot; still reversible</span>
        <div class="shot-frame"><img src="cr-rollback.png"></div>
      </div>
    </div>
  </div>
  <div class="caption-row">Every write is logged with before/after state. <b>Approved changes apply with one click; applied changes roll back with one click.</b></div>
</div>
</body>
</html>
