<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
.frame { align-items:center; justify-content:center; background: var(--ink-950); }
.shot { width:1920px; height:1080px; overflow:hidden; position:relative; }
.shot img { position:absolute; top:50%; left:50%; width:1920px; height:auto;
  transform: translate(-50%,-50%) scale(1.0);
  animation: zoom 15s ease forwards; }
@keyframes zoom {
  0%   { transform: translate(-50%,-50%) scale(1.0); }
  100% { transform: translate(-50%,-50%) scale(1.035); }
}
.fade { position:absolute; inset:0; background: var(--ink-950); opacity:1; animation: fadeout 0.6s ease forwards; }
@keyframes fadeout { to { opacity:0; } }
</style></head>
<body>
<div class="frame">
  <div class="shot"><img src="../assets/01-ai-builds-you-approve.png"></div>
  <div class="fade"></div>
</div>
</body></html>
