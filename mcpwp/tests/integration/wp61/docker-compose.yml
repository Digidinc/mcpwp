services:
  db:
    image: mariadb:10.6@sha256:114d40be36852d0a019afd8458f7e1cc63fd300403b115b1f32e31130d5f671b
    pull_policy: never
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: integration-root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pintegration-root"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [wp61]

  wordpress:
    image: wordpress:6.1.1-php7.4-apache@sha256:7e46cf3373751b6d62b7a0fc3a7d6686f641a34a2a0eb18947da5375c55fd009
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISABLE_WP_CRON', true );
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
    volumes:
      - wordpress_data:/var/www/html
      - ../../..:/var/www/html/wp-content/plugins/mumega-mcp:ro
      - ./:/opt/mcpwp-integration:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_exists('/var/www/html/wp-load.php') ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [wp61]

networks:
  wp61:
    internal: true

volumes:
  wordpress_data:
