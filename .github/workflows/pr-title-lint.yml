name: Lint PR Title

# Enforce Conventional Commit PR titles so release-please gets clean SemVer
# input (the squash-merge commit is the PR title). Validated inline from the
# event payload — no GitHub API call — so it works regardless of the org's
# default GITHUB_TOKEN permissions.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: PR title must be a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          # type(optional-scope)(optional !): lowercase-starting summary
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)(\([a-z0-9._/-]+\))?!?: [^A-Z].+'; then
            echo "::notice::Valid Conventional Commit title."
          else
            echo "::error::PR title must be a Conventional Commit, e.g. 'fix(scope): lowercase summary'. Allowed types: feat, fix, perf, revert, docs, style, refactor, test, build, ci, chore. The summary must not start with an uppercase letter."
            exit 1
          fi
