name: Publish Release (Canonical R2)

# Manual, explicit trigger — publishes whatever version is on the dispatched
# ref (main, after a release-please release PR is merged) to the R2 bucket
# mumcp-updates that backs the update channel.
#
# Both public channels — updates.mcpwp.net and mumega.com/mcp-updates/* — are
# Cloudflare Workers reading that one bucket, so this single upload updates all
# of them. No VPS filesystem access is involved (the old /var/www/mcp-updates
# static copy was a write nothing served and has been removed).
#
# Called automatically by release-please.yml the moment a release is cut, so a
# tagged version cannot sit unpublished — tagging is not shipping, and #716
# showed what an undelivered security release costs. Still dispatchable by hand
# for a re-publish.
on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: "Ref to publish from. Defaults to the triggering ref."
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: mumcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Publish to canonical R2 channel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "e39eaf94f33092c4efd029d94ae1e9dd"
          MCPWP_WORKER_DIR: ${{ github.workspace }}
        run: bash scripts/publish_update_release.sh --build --r2-only

      - name: Summary
        if: always()
        run: |
          echo "### Publish to updates.mcpwp.net" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Both channels (updates.mcpwp.net + mumega.com/mcp-updates) are R2-backed and updated by this run" >> "$GITHUB_STEP_SUMMARY"
