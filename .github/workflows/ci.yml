name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release-compatibility:
    name: Python Scripts Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all scripts/tests/test_*.py suites
        # A specific filename here silently drops every future test_*.py that
        # isn't test_release_compatibility.py — test_intake_triage.py (#940)
        # would otherwise exist in the repo and never run in CI. Broadened to
        # the glob unittest discover already understands.
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py"

  php-lint:
    name: PHP Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        run: |
          find mcpwp -name "*.php" -not -path "*/freemius/*" -not -path "*/node_modules/*" \
            -exec php -l {} \; | grep -v "No syntax errors" || true
          # Fail if any syntax errors found
          find mcpwp -name "*.php" -not -path "*/freemius/*" \
            -exec php -l {} \; 2>&1 | grep "Parse error" && exit 1 || exit 0

  proxy-worker-tests:
    name: Proxy Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcpwp-agency-proxy/package-lock.json
      - name: Install dependencies
        run: cd mcpwp-agency-proxy && npm ci
      - name: Run tests
        run: cd mcpwp-agency-proxy && npm test
      - name: Audit dependencies (runtime only)
        # Only runtime deps ship to the Cloudflare Worker edge; build tooling
        # (wrangler/miniflare/sharp) never reaches production, so gating merges
        # on its advisories blocks product code over unreachable CVEs. Audit
        # what actually ships. Dev-tooling advisories are tracked upstream and
        # patched when wrangler bumps. See #691.
        run: cd mcpwp-agency-proxy && npm audit --omit=dev --audit-level=high

  mcp-server-stdio-smoke:
    name: MCP Server Stdio Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (bun.lock is the build lockfile)
        run: cd mcp-server && bun install --frozen-lockfile
      - name: Build bundle
        run: cd mcp-server && bun run build
      - name: Stdio smoke tests (large message, initialize instructions)
        run: cd mcp-server && npm test
