name: MCPWP CI

on:
  pull_request:
    paths:
      - "mcpwp/**"
      - ".github/workflows/mcpwp-ci.yml"
  push:
    branches:
      - main
    paths:
      - "mcpwp/**"
      - ".github/workflows/mcpwp-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Install Dev Dependencies
        run: composer install --working-dir mcpwp --no-interaction --prefer-dist

      - name: PHP Syntax Lint
        run: |
          find mcpwp -path 'mcpwp/vendor' -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      # Lint and unit tests both load the whole tree, so neither sees a class
      # that only a distribution build removes. #723 shipped a fatal to every
      # premium install through that gap.
      - name: Pruned-class Guard Check
        run: bash scripts/verify_distignore_refs.sh

      # A test file collected by no rule in phpunit.xml runs zero times while
      # looking like coverage. Three were in that state until 2026-07-27, one
      # of them covering the Elementor save path where #678 lived.
      - name: Test Discovery Check
        run: bash scripts/verify_test_discovery.sh

      # The defect #734 actually had: CI invoked verify_test_discovery.sh on a
      # file nobody had pushed, exit 127. Checking it here fixes that at its own
      # chokepoint, independently of what .gitignore happens to say.
      - name: Workflow Script Tracking Check
        run: bash scripts/verify_workflow_scripts.sh

      # .sh is where credentials get typed, and shell scripts are tracked by
      # default since #734. An agent running `git add -A` commits a local helper
      # with no human in the loop — that is how .wrangler account state reached
      # a published ZIP — and a leaked credential is not recoverable by
      # reverting (#738).
      - name: Committed Credential Check
        run: bash scripts/verify_no_committed_secrets.sh

      - name: Unit Tests
        run: mcpwp/vendor/bin/phpunit --configuration mcpwp/tests/phpunit.xml

      # A suite that only passes in declaration order is not a passing suite:
      # it means one test is setting process state another test depends on, and
      # which one broke is decided by the order the files happen to be read in.
      # Four such couplings were live at once — a constant, a sabotage switch, a
      # cron-mode flag and a leaked HTTP mock (#757). Random order is what makes
      # the next one fail here rather than months later somewhere unrelated.
      # PHPUnit prints the seed it used, so a failure is reproducible with
      # --random-order-seed=<that value>.
      - name: Unit Tests (random order)
        run: mcpwp/vendor/bin/phpunit --configuration mcpwp/tests/phpunit.xml --order-by=random

      # Browser-side scripts with a Node test (node:test, no dependencies) —
      # e.g. the WebMCP registration script (#981).
      - name: JS Unit Tests
        run: node --test mcpwp/tests/js/*.test.js
