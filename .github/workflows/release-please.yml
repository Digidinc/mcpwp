name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  brand-release-title:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout in this job, so pass --repo explicitly; otherwise gh tries to
      # infer the repo from a local git remote and fails with "not a git repository".
      - run: |
          gh release edit "${{ needs.release-please.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --title "MCPWP ${{ needs.release-please.outputs.tag_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

  build-and-attach-plugin-zips:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build all distribution zips
        run: bash mcpwp/scripts/build-all.sh
      - name: Attach zips to the release
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            mcpwp/scripts/mcpwp-*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  sync-wporg-changelog:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync WP.org changelog surfaces
        run: node scripts/sync-wporg-changelog.mjs --version "${{ needs.release-please.outputs.version }}"
      - name: Commit synced files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mcpwp/readme.txt version.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: sync WP.org changelog for ${{ needs.release-please.outputs.tag_name }}"
            git push origin main
          fi

  # A release nobody published reaches no site. This ran as a remembered
  # manual step until #716 made the cost of forgetting concrete: the fix for a
  # security release could not be delivered because the channel it travels on
  # was never checked. Publishing is now part of releasing, and the publish
  # script fails the job if the channel cannot actually serve the new version.
  #
  # Runs after the changelog sync so the manifest we upload carries the final
  # changelog text, and checks out main rather than the triggering SHA to pick
  # that commit up.
  publish-canonical-channel:
    needs: [release-please, sync-wporg-changelog]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-release.yml
    with:
      ref: main
    secrets: inherit

  # The premium build updates through Freemius, not through updates.mcpwp.net,
  # so publishing the canonical channel ships nothing to a paying customer.
  # This was a manual step, and on 2026-07-27 Freemius turned out to have been
  # stuck on 3.7.0 since 2026-07-21 — 3.7.1, 3.7.2, 3.8.0 and 3.9.0 never
  # reached a paid install, including the #716 updater fix. Same lesson as
  # publish-canonical-channel, one channel over: releasing has to publish.
  #
  # Separate job so a Freemius outage cannot hold up the self-hosted channel.
  publish-freemius:
    needs: [release-please, sync-wporg-changelog]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish to Freemius
        env:
          FREEMIUS_BEARER_TOKEN: ${{ secrets.FREEMIUS_BEARER_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [ -z "$FREEMIUS_BEARER_TOKEN" ]; then
            echo "::error::FREEMIUS_BEARER_TOKEN is not configured — the premium build cannot be published."
            echo "Paying customers stay on the previous release until this secret exists."
            exit 1
          fi
          # --skip-bump: release-please already wrote every version artefact,
          # and letting the script rewrite them would desynchronise the set.
          bash scripts/release_freemius.sh --version "$VERSION" --skip-bump

      - name: Verify Freemius serves the new version
        env:
          FREEMIUS_BEARER_TOKEN: ${{ secrets.FREEMIUS_BEARER_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          bash scripts/verify_freemius_channel.sh \
            --expect-version "$VERSION" --retries 4 --delay 20
